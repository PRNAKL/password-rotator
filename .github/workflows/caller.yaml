name: Call the reusable deploy

on:
  push:
    branches:
      - "*"   # triggers on every branch

jobs:
  call-reusable:
    uses: PRNAKL/password_rotator_pipeline/.github/workflows/handle_deployment.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'Dev' }}
